<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Comparison</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .flex {
            display: flex;
            justify-content: space-between;
        }

        .textarea-container {
            width: 48%;
        }

        textarea {
            width: 95%;
            height: 300px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8vw;
            border-radius: 2px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            resize: none;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
        }

        button:hover {
            background-color: #218838;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-top: 40px;
        }

        .result-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .result-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .result {
            width: 90%;
            white-space: pre-wrap;
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #ccc;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .highlight {
            background-color: lightgreen;
            padding: 1px;
            border-radius: 1px;
        }

        .non-matching {
            background-color: lightcoral;
            padding: 1px;
            border-radius: 1px;
        }

        .transparent {
            background-color: transparent;
        }
            .file-upload-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .file-input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .upload-button {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .upload-button:hover {
            background-color: #0056b3;
        }
            .textarea-container {
            margin-bottom: 20px;
        }

        .file-upload-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .file-input {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .upload-button {
            padding: 5px 10px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .upload-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Code Comparison System</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="flex">
                <div class="textarea-container">
                    <label for="code_input1">Comparison Code (比較者):</label><br>
                    <textarea id="code_input1" name="code_input1">{{ code_input1 }}</textarea><br><br>

                    <label for="file_input1">選擇檔案:</label><br>
                    <div class="file-upload-container">
                        <input type="file" id="file_input1" class="file-input">
                        <button type="button" id="upload_file1" class="upload-button">Upload</button>
                    </div><br><br>
                </div>

                <div class="textarea-container">
                    <label for="code_input2">Compared Code (被比較者):</label><br>
                    <textarea id="code_input2" name="code_input2">{{ code_input2 }}</textarea><br><br>

                    <label for="file_input2">選擇檔案:</label><br>
                    <div class="file-upload-container">
                        <input type="file" id="file_input2" class="file-input">
                        <button type="button" id="upload_file2" class="upload-button">Upload</button>
                    </div><br><br>
                </div>
            </div>

            <button type="submit">Compare</button>
        </form>

        <h2>Comparison Result:</h2>
        <div class="result-container">
            <div class="result-box">
                <h3>Code 1</h3>
                <div class="result" id="result_left">{{ result_left|safe }}</div>
            </div>
            <div class="result-box">
                <h3>Code 2</h3>
                <div class="result" id="result_right">{{ result_right|safe }}</div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('code_input1').addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                let start = e.target.selectionStart;
                let end = e.target.selectionEnd;

                // Calculate the number of spaces to add to align to the nearest multiple of 4
                let currentLineStart = e.target.value.lastIndexOf('', start - 1) + 1;
                let currentIndentation = start - currentLineStart;
                let spacesToAdd = (4 - (currentIndentation % 4)) % 4;

                // set textarea value to: text before caret + spaces + text after caret
                e.target.value = e.target.value.substring(0, start) + ' '.repeat(spacesToAdd) + e.target.value.substring(end);

                // put caret at right position again
                e.target.selectionStart = e.target.selectionEnd = start + spacesToAdd;
            }
        });

        document.getElementById('code_input2').addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                let start = e.target.selectionStart;
                let end = e.target.selectionEnd;

                // Calculate the number of spaces to add to align to the nearest multiple of 4
                let currentLineStart = e.target.value.lastIndexOf('', start - 1) + 1;
                let currentIndentation = start - currentLineStart;
                let spacesToAdd = (4 - (currentIndentation % 4)) % 4;

                // set textarea value to: text before caret + spaces + text after caret
                e.target.value = e.target.value.substring(0, start) + ' '.repeat(spacesToAdd) + e.target.value.substring(end);

                // put caret at right position again
                e.target.selectionStart = e.target.selectionEnd = start + spacesToAdd;
            }
        });

    document.getElementById('upload_file1').addEventListener('click', function () {
            let file = document.getElementById('file_input1').files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('code_input1').value = e.target.result;
                    document.getElementById('file_input1').value = '';
                };
                reader.readAsText(file);
            }
        });

        document.getElementById('upload_file2').addEventListener('click', function () {
            let file = document.getElementById('file_input2').files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('code_input2').value = e.target.result;
                    document.getElementById('file_input2').value = '';
                };
                reader.readAsText(file);
            }
        });
    </script>
</body>

</html>
